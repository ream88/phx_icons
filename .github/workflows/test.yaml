name: Test

on:
  push:
    branches: [main]
  pull_request:

env:
  MIX_ENV: test

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        elixir: ["1.18", "1.19"]
        otp: ["27", "28"]
        phoenix_live_view_version: ["0.20.0", "1.0.0", "1.1.0", "1.2.0"]
        exclude:
          # Elixir 1.18 is only tested on OTP 27.
          - elixir: "1.18"
            otp: "28"

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ matrix.phoenix_live_view_version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ matrix.phoenix_live_view_version }}-

      - run: sed -i 's/{:phoenix_live_view, "~> 0.20 or ~> 1.0"}/{:phoenix_live_view, "~> ${{ matrix.phoenix_live_view_version }}"}/' mix.exs
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test

  integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-integration-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-integration-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test --only network
